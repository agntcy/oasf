version: "3"

## Load config from dotenv file
dotenv:
  - '{{ .ROOT_DIR }}/.env'

## Collection of config params
vars:
  ## Image config
  IMAGE_REPO: '{{ .IMAGE_REPO | default "ghcr.io/agntcy" }}'

  ## oasf-server release used to preview and test the schema. Renovate bumps
  ## .oasf-server-version; set OASF_SERVER_VERSION to try another one.
  OASF_SERVER_VERSION:
    sh: 'echo "${OASF_SERVER_VERSION:-$(cat "{{ .ROOT_DIR }}/.oasf-server-version")}"'
  OASF_SERVER_IMAGE: '{{ .OASF_SERVER_IMAGE | default (printf "%s/oasf-server:%s" .IMAGE_REPO .OASF_SERVER_VERSION) }}'
  ## Checkout of agntcy/oasf-server at that version, for its test suite
  OASF_SERVER_DIR: '{{ .ROOT_DIR }}/.oasf-server'
  SERVER_CONTAINER: '{{ .SERVER_CONTAINER | default "oasf-server" }}'
  SERVER_PORT: '{{ .SERVER_PORT | default "8080" }}'

  ## Dependency config
  BIN_DIR: '{{ .ROOT_DIR }}/bin'
  PROTOC_VERSION: '27.1'
  PROTOC_BIN: '{{ .BIN_DIR }}/protoc-{{.PROTOC_VERSION}}'
  BUFBUILD_VERSION: '1.50.1'
  BUFBUILD_BIN: '{{ .BIN_DIR }}/bufbuild-{{.BUFBUILD_VERSION}}'

## Set refresh interval for observable tasks like hot-reload
interval: 500ms

tasks:
  ##
  ## General
  ##
  default:
    cmds:
      - task -l

  build:
    desc: Build project artifacts
    cmds:
      - task: build:schema

  build:schema:
    desc: Build the OASF schema image from the local schema/ directory
    vars:
      SCHEMA_IMAGE_TAG: '{{ .SCHEMA_IMAGE_TAG | default "dev" }}'
    cmds:
      - docker build -f schema.Dockerfile -t {{ .IMAGE_REPO }}/oasf-schema:{{ .SCHEMA_IMAGE_TAG }} schema

  ##
  ## Schema preview
  ##
  server:up:
    desc: Serve the local schema/ with the pinned oasf-server image at localhost:8080
    preconditions:
      - which docker curl
    cmds:
      - task: server:down
        vars: {SERVER_CONTAINER: '{{ .SERVER_CONTAINER }}'}
      - |
        docker run --detach --name {{ .SERVER_CONTAINER }} -p {{ .SERVER_PORT }}:8080 \
          -v "{{ .ROOT_DIR }}/schema:/app/schema:ro" \
          {{- if .LOG_LEVEL }}
          -e LOG_LEVEL={{ .LOG_LEVEL }} \
          {{- end }}
          {{- if .SCHEMA_EXTENSION }}
          -e SCHEMA_EXTENSION={{ .SCHEMA_EXTENSION }} \
          {{- end }}
          {{ .OASF_SERVER_IMAGE }} > /dev/null
      - |
        if ! curl --silent --fail --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://localhost:{{ .SERVER_PORT }}/api/version; then
          docker logs {{ .SERVER_CONTAINER }}
          exit 1
        fi
      - echo "oasf-server {{ .OASF_SERVER_VERSION }} is serving schema/ at http://localhost:{{ .SERVER_PORT }}. Run task server:reload to pick up changes."

  server:reload:
    desc: Reload the schema in the server started by server:up whenever schema/ changes
    watch: true
    sources:
      - schema/**/*
    preconditions:
      - sh: docker inspect {{ .SERVER_CONTAINER }} > /dev/null 2>&1
        msg: Start the server with task server:up first.
    cmds:
      - docker exec {{ .SERVER_CONTAINER }} /app/bin/schema_server rpc "Schema.reload()"
      - echo "Reloaded schema! Use CTRL + C to exit."

  server:down:
    desc: Stop the server started by server:up
    cmds:
      - docker rm --force {{ .SERVER_CONTAINER }} > /dev/null 2>&1 || true

  ##
  ## Tests
  ##
  test:
    desc: Run all test suites
    cmds:
      - task: test:schema
      - task: test:proto
      - task: test:server
      - task: test:server:extensions
      - task: test:server:smoke

  test:schema:
    desc: Validate schema JSON files against their metaschemas
    preconditions:
      - which go
    dir: '{{ .ROOT_DIR }}/schema/test'
    cmds:
      - cmd: echo "Validating schema files against metaschemas..."
      - cmd: go test -v -count=1 ./...

  test:proto:
    desc: Test if protobuf files are in sync with the JSON schema
    preconditions:
      - which go
    dir: '{{ .ROOT_DIR }}/proto/test'
    cmds:
      - cmd: echo "Checking proto ↔ JSON schema sync..."
      - cmd: go test -v -count=1 ./...

  server:checkout:
    desc: Check out agntcy/oasf-server at the pinned version into .oasf-server
    internal: true
    status:
      - test "$(git -C '{{ .OASF_SERVER_DIR }}' describe --tags --exact-match 2>/dev/null)" = '{{ .OASF_SERVER_VERSION }}'
    cmds:
      - rm -rf '{{ .OASF_SERVER_DIR }}'
      - git clone --quiet --depth 1 --branch '{{ .OASF_SERVER_VERSION }}' https://github.com/agntcy/oasf-server.git '{{ .OASF_SERVER_DIR }}'

  test:server:
    desc: Load schema/ with the pinned oasf-server's test suite (schema integrity, API and unit tests)
    preconditions:
      - which mix
    deps:
      - server:checkout
    dir: '{{ .OASF_SERVER_DIR }}'
    env:
      SCHEMA_DIR: '{{ .ROOT_DIR }}/schema'
    cmds:
      - mix deps.get
      - mix test

  test:server:extensions:
    desc: Same as test:server, with the example extension loaded
    preconditions:
      - which mix
    deps:
      - server:checkout
    dir: '{{ .OASF_SERVER_DIR }}'
    env:
      SCHEMA_DIR: '{{ .ROOT_DIR }}/schema'
      SCHEMA_EXTENSION: test/extensions
    cmds:
      - mix deps.get
      - mix test

  test:server:smoke:
    desc: Serve schema/ with the pinned oasf-server image and smoke-test its pages and endpoints
    preconditions:
      - which docker curl jq
    deps:
      - server:checkout
    vars:
      SMOKE_PORT: '{{ .SMOKE_PORT | default "18080" }}'
      SCHEMA_VERSION:
        sh: jq -r .version '{{ .ROOT_DIR }}/schema/version.json'
    cmds:
      - defer:
          task: server:down
          vars: {SERVER_CONTAINER: oasf-server-smoke}
      - task: server:up
        vars:
          SERVER_CONTAINER: oasf-server-smoke
          SERVER_PORT: '{{ .SMOKE_PORT }}'
      - '{{ .OASF_SERVER_DIR }}/scripts/smoke-test.sh http://localhost:{{ .SMOKE_PORT }} {{ .SCHEMA_VERSION }}'

  ##
  ## Lint and format
  ##
  lint:
    desc: Run all linters
    cmds:
      - task: lint:proto

  lint:proto:
    desc: Run Proto linters
    deps:
      - task: deps:protoc
      - task: deps:bufbuild
    dir: ./proto
    cmds:
      - '{{.BUFBUILD_BIN}} dep update'
      - '{{.BUFBUILD_BIN}} format --diff --exit-code'
      - '{{.BUFBUILD_BIN}} lint'

  fmt:
    desc: Run formatters
    cmds:
      - task: fmt:proto
      - task: fmt:schema

  fmt:proto:
    desc: Run Proto formatters
    deps:
      - task: deps:protoc
      - task: deps:bufbuild
    dir: ./proto
    cmds:
      - '{{.BUFBUILD_BIN}} dep update'
      - '{{.BUFBUILD_BIN}} format --output ./'

  fmt:schema:
    desc: Run Schema formatters
    preconditions:
      - which jq
    dir: ./schema
    cmds:
      - cmd: echo "Formatting all JSON files with jq..."
      - cmd: |
          find . -name "*.json" -type f | while read file; do
            echo "Formatting $file..."
            jq --indent 2 . "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
      - cmd: echo "Formatting dictionary file with custom jq rules..."
      - cmd: |
          jq '.attributes |= (to_entries | sort_by(.key) | from_entries) | .types.attributes |= (to_entries | sort_by(.key) | from_entries)' dictionary.json > sorted.dictionary.json
          mv sorted.dictionary.json dictionary.json

  ##
  ## Dependencies
  ##
  deps:
    desc: Install project dependencies
    cmds:
      - task: deps:protoc
      - task: deps:bufbuild

  deps:bin-dir:
    desc: Create bin directory
    internal: true
    run: once
    cmd: mkdir -p {{.BIN_DIR}}
    status:
      - test -d {{.BIN_DIR}}

  deps:protoc:
    desc: Ensure supported Protoc version and plugins are installed
    internal: true
    deps:
      - deps:bin-dir
    preconditions:
      - which go
      - which curl
      - which unzip
    vars:
      ARCH_TYPE: '{{ if eq ARCH "arm64" }}aarch_64{{ else if eq ARCH "amd64" }}x86_64{{else if eq ARCH "s390x"}}x390_64{{ else }}{{ARCH}}{{ end }}'
      OS_VARIANT: '{{ if eq OS "darwin" }}osx-universal_binary{{ else if eq OS "windows" }}win64{{else}}linux-{{.ARCH_TYPE}}{{ end }}'
    cmds:
      - cmd: echo "Downloading Protoc v{{.PROTOC_VERSION}}..."
      - cmd: |
          curl -sL https://github.com/protocolbuffers/protobuf/releases/download/v{{.PROTOC_VERSION}}/protoc-{{.PROTOC_VERSION}}-{{.OS_VARIANT}}.zip -o {{.BIN_DIR}}/tmp.zip
          unzip -j {{.BIN_DIR}}/tmp.zip "bin/protoc" -d {{.BIN_DIR}}
          mv {{.BIN_DIR}}/protoc {{.PROTOC_BIN}}
          rm {{.BIN_DIR}}/tmp.zip
      - cmd: chmod +x {{.PROTOC_BIN}}
      - cmd: echo "Downloading go plugins for protoc..."
      - cmd: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - cmd: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - cmd: go install github.com/NathanBaulch/protoc-gen-cobra@latest
    status:
      - test -x {{.PROTOC_BIN}}

  deps:bufbuild:
    desc: Ensure supported bufbuild version is installed
    internal: true
    deps:
      - deps:bin-dir
    preconditions:
      - which curl
    vars:
      ARCH_TYPE: '{{ if eq ARCH "amd64" }}x86_64{{ else }}{{ARCH}}{{ end }}'
    cmds:
      - cmd: echo "Downloading BufBuild v{{.BUFBUILD_VERSION}}..."
      - cmd: |
          curl -L "https://github.com/bufbuild/buf/releases/download/v{{.BUFBUILD_VERSION}}/buf-{{OS}}-{{.ARCH_TYPE}}" -o {{.BUFBUILD_BIN}}
      - cmd: chmod +x {{.BUFBUILD_BIN}}
    status:
      - test -x {{.BUFBUILD_BIN}}
