# Publishes ghcr.io/agntcy/oasf-schema, a data-only image holding one schema under
# /schema, which oasf-server deployments mount. Release images are tagged with
# the schema version from schema/version.json, which is what oasf-server
# deployments list:
#
# - a vX.Y.Z tag publishes <schema version>, so v1.1.3 publishes 1.1.0 and each
#   patch release moves its line's tag to the latest schema content,
# - a push to main publishes main and <sha>,
# - workflow_dispatch publishes any ref, for backfills: a vX.Y.Z tag gets the
#   same tag as a tag push, any other ref only <sha>. Backfill only the latest
#   patch of each line, or the line's tag moves back to older content.
#
# Tags pushed on a release branch only trigger this workflow if the branch has
# it; otherwise publish them with workflow_dispatch from main.
name: Schema Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - schema/**
      - schema.Dockerfile
      - .github/workflows/schema-image.yaml
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose schema to publish, usually a vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/agntcy/oasf-schema

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing and build provenance, as for oasf-server.
      id-token: write
      attestations: write
    steps:
      # The Dockerfile always comes from this commit, so older tags can be
      # backfilled without carrying it.
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          persist-credentials: false

      - name: Checkout schema
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: src
          sparse-checkout: schema
          persist-credentials: false

      - name: Resolve image tags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha=$(git -C src rev-parse HEAD)
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            ref="${INPUT_REF#refs/tags/}"
          else
            ref="${GITHUB_REF#refs/tags/}"
          fi

          schema_version=$(jq -er .version src/schema/version.json)
          version="${schema_version}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            tags=()
          elif [[ "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF}" == refs/tags/* ]]; then
            tags=("${schema_version}")
            version="${ref}"
          elif [[ "${EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags=(main "${sha}")
          else
            tags=("${sha}")
          fi

          {
            echo "sha=${sha}"
            echo "schema_version=${schema_version}"
            echo "version=${version}"
            echo "tags<<EOF"
            for tag in ${tags[@]+"${tags[@]}"}; do echo "${IMAGE}:${tag}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build test image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: src/schema
          file: schema.Dockerfile
          platforms: linux/amd64
          load: true
          tags: oasf-schema:test

      - name: Check the image content
        run: |
          set -euo pipefail
          docker run --rm oasf-schema:test cat /schema/version.json | jq -S . > image-version.json
          jq -S . src/schema/version.json > source-version.json
          if ! diff -u source-version.json image-version.json; then
            echo "::error::/schema/version.json in the image does not match the schema"
            exit 1
          fi
          if docker run --rm oasf-schema:test test -e /schema/test; then
            echo "::error::/schema/test must not be in the image"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ steps.resolve.outputs.tags != '' }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: notused
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        if: ${{ steps.resolve.outputs.tags != '' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: src/schema
          file: schema.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.resolve.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/agntcy/oasf
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.version }}
            org.opencontainers.image.title=oasf-schema
            org.opencontainers.image.description=OASF schema ${{ steps.resolve.outputs.schema_version }} for oasf-server, under /schema
            org.opencontainers.image.licenses=Apache-2.0

      - name: Install cosign
        if: ${{ steps.resolve.outputs.tags != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign and attest the digest, never a tag: tags are mutable.
      - name: Sign the image
        if: ${{ steps.resolve.outputs.tags != '' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: ${{ steps.resolve.outputs.tags != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
